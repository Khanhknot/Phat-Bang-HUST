<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tra Cứu Thứ Tự Nhận Bằng</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #0d1b2a;
      --navy-mid: #1b2f47;
      --gold: #c9a84c;
      --gold-light: #e8c97e;
      --cream: #f5f0e8;
      --white: #ffffff;
      --red: #c0392b;
      --green: #1a6b3c;
      --text-muted: #8a9ab0;
    }

    body {
      min-height: 100vh;
      background-color: var(--navy);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(201, 168, 76, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(201, 168, 76, 0.05) 0%, transparent 50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: 'DM Sans', sans-serif;
    }

    /* Decorative top border */
    .top-border {
      width: 100%;
      max-width: 520px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
      margin-bottom: 2.5rem;
      border-radius: 2px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--navy-mid);
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 4px;
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Corner accents */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.6;
    }

    .card::before {
      top: 12px;
      left: 12px;
      border-width: 2px 0 0 2px;
    }

    .card::after {
      bottom: 12px;
      right: 12px;
      border-width: 0 2px 2px 0;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .logo-divider {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.5));
    }

    .logo-divider.right {
      background: linear-gradient(90deg, rgba(201, 168, 76, 0.5), transparent);
    }

    .logo-diamond {
      width: 8px;
      height: 8px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .university-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--gold);
      text-transform: uppercase;
    }

    h1,
    .stt-label {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.2;
    }

    h1 {
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      font-weight: 300;
    }

    /* Input section */
    .input-section {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .input-wrapper {
      display: flex;
      gap: 0.6rem;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 3px;
      padding: 0.75rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--white);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.05em;
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.2);
      font-weight: 300;
    }

    input[type="text"]:focus {
      border-color: var(--gold);
      background: rgba(201, 168, 76, 0.06);
    }

    button {
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 3px;
      padding: 0.75rem 1.4rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button:hover {
      background: var(--gold-light);
    }

    button:active {
      transform: scale(0.97);
    }

    /* Result area */
    #result {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(201, 168, 76, 0.15);
      padding-top: 1.5rem;
      transition: opacity 0.3s;
    }

    #search-panel[hidden]+#result {
      border-top: 0;
      padding-top: 0;
    }

    /* Found card */
    .result-found {
      width: 100%;
      animation: fadeUp 0.35s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stt-display {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .stt-label {
      margin-bottom: 0.6rem;
    }

    .stt-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 12vw, 4.5rem);
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      text-shadow: 0 0 40px rgba(201, 168, 76, 0.3);
    }

    .degree-text {
      color: var(--gold-light);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      margin-top: 0.7rem;
      text-align: center;
    }

    .student-name {
      color: var(--white);
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.25rem, 5vw, 1.65rem);
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
    }

    .student-id {
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      margin-top: 0.35rem;
      text-align: center;
    }

    .reset-button {
      display: block;
      margin: 1.5rem auto 0;
      background: transparent;
      border: 1px solid rgba(201, 168, 76, 0.55);
      color: var(--gold-light);
    }

    .reset-button:hover {
      background: rgba(201, 168, 76, 0.1);
    }

    [hidden] {
      display: none !important;
    }

    /* Not found */
    .result-notfound {
      text-align: center;
      animation: fadeUp 0.3s ease;
    }

    .notfound-icon {
      color: #f87171;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .notfound-text {
      color: #f87171;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .notfound-hint {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 0.3rem;
    }

    /* Footer */
    .bottom-border {
      width: 100%;
      max-width: 520px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.2), transparent);
      margin-top: 1.5rem;
    }

    .footer-text {
      margin-top: 1rem;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 420px) {
      .card {
        padding: 2rem 1.25rem;
      }

      .input-wrapper {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="top-border"></div>

  <div class="card">
    <div id="search-panel">
      <div class="header">

        <h1>Tra Cứu STT Ký Bằng TN</h1>
      </div>

      <div class="input-section">
        <label for="mssv-input">Nhập mã số sinh viên</label>
        <div class="input-wrapper">
          <input type="text" id="mssv-input" placeholder="VD: 20201999" inputmode="numeric" autocomplete="off"
            spellcheck="false" maxlength="9" pattern="[0-9]{8,9}" aria-describedby="input-hint" />
          <button type="button" id="lookup-button">Tra cứu</button>
        </div>
      </div>
    </div>

    <div id="result" role="status" aria-live="polite" hidden>
      <div class="result-found" id="result-found" hidden>
        <div class="stt-display">
          <div class="stt-label">STT ký sổ nhận bằng</div>
          <div class="stt-number" id="result-stt"></div>
        </div>
        <div class="student-name" id="result-name"></div>
        <div class="student-id" id="result-mssv"></div>
        <div class="degree-text" id="result-degree"></div>
        <button type="button" id="reset-button" class="reset-button">Tra MSSV khác</button>
      </div>

      <div class="result-notfound" id="result-error" hidden>
        <div class="notfound-icon">✕</div>
        <div class="notfound-text" id="error-title">Không tìm thấy sinh viên</div>
        <div class="notfound-hint" id="input-hint">Kiểm tra lại mã số sinh viên</div>
      </div>
    </div>
  </div>

  <div class="bottom-border"></div>


  <script src="students.js"></script>
  <script>
    const lookupMap = new Map(STUDENTS.map(record => [record.mssv, record]));

    const searchPanel = document.getElementById('search-panel');
    const input = document.getElementById('mssv-input');
    const lookupButton = document.getElementById('lookup-button');
    const resetButton = document.getElementById('reset-button');
    const resultArea = document.getElementById('result');
    const foundResult = document.getElementById('result-found');
    const errorResult = document.getElementById('result-error');
    const errorTitle = document.getElementById('error-title');
    const errorHint = document.getElementById('input-hint');
    const resultStt = document.getElementById('result-stt');
    const resultName = document.getElementById('result-name');
    const resultMssv = document.getElementById('result-mssv');
    const resultDegree = document.getElementById('result-degree');

    lookupButton.addEventListener('click', lookup);
    resetButton.addEventListener('click', resetLookup);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') lookup();
    });

    function showOnly(target) {
      resultArea.hidden = !target;
      foundResult.hidden = target !== foundResult;
      errorResult.hidden = target !== errorResult;
    }

    function showError(title, hint) {
      errorTitle.textContent = title;
      errorHint.textContent = hint;
      showOnly(errorResult);
    }

    function lookup() {
      const mssv = input.value.trim();

      if (!mssv) {
        showOnly(null);
        return;
      }

      if (!/^\d{8,9}$/.test(mssv)) {
        showError('Mã số sinh viên không hợp lệ', 'Vui lòng nhập 8–9 chữ số');
        return;
      }

      const record = lookupMap.get(mssv);

      if (!record) {
        showError('Không tìm thấy sinh viên', 'Kiểm tra lại mã số sinh viên');
        return;
      }

      resultStt.textContent = record.stt;
      resultName.textContent = record.name;
      resultMssv.textContent = `MSSV: ${record.mssv}`;
      resultDegree.textContent = `Bằng ${record.degree}`;
      searchPanel.hidden = true;
      showOnly(foundResult);
    }

    function resetLookup() {
      input.value = '';
      searchPanel.hidden = false;
      showOnly(null);
      input.focus();
    }
  </script>
</body>

</html>
